<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>여동욱 | MyLink</title>
<meta name="description" content="광운대학교 여동욱의 마이링크">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --kw: #7D1A2D; --bg: #F7F3F4; --card: #FFFFFF; --text: #1E1E1E; --sub: #6B6B6B; --line: #E7DADD; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161214; --card: #221C1F; --text: #F2ECEE; --sub: #A89DA1; --line: #3A2F33; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; background: var(--bg); color: var(--text); font-family: 'Noto Sans KR', sans-serif;
         display: flex; justify-content: center; padding: 56px 16px 40px; }
  main { width: 100%; max-width: 440px; display: flex; flex-direction: column; align-items: center; gap: 28px; }
  .profile { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
  .avatar { width: 104px; height: 104px; border-radius: 50%; border: 3px solid var(--kw); object-fit: cover; background: var(--card); }
  h1 { font-size: 24px; font-weight: 700; }
  .bio { font-size: 15px; color: var(--sub); line-height: 1.6; }
  ul { list-style: none; width: 100%; display: flex; flex-direction: column; gap: 12px; }
  a.link { display: flex; align-items: center; gap: 14px; padding: 16px 20px; background: var(--card); border: 1px solid var(--line);
           border-radius: 14px; color: inherit; text-decoration: none; font-weight: 500; transition: transform .15s, border-color .15s; }
  a.link:hover { transform: translateY(-2px); border-color: var(--kw); }
  .icon { width: 36px; height: 36px; flex: none; border-radius: 10px; background: var(--kw); color: #fff;
          display: grid; place-items: center; font-size: 17px; font-weight: 700; }
  .label { flex: 1; display: flex; flex-direction: column; }
  .label small { font-size: 13px; color: var(--sub); font-weight: 400; }
  .arrow { color: var(--sub); }
  footer { font-size: 12px; color: var(--sub); }
</style>
</head>
<body>
<main>
  <section class="profile">
    <img class="avatar" src="https://github.com/yeo-develop.png" alt="여동욱 프로필 사진">
    <h1>여동욱</h1>
    <p class="bio">광운대학교 · 게임과 콘텐츠를 만드는 학생</p>
  </section>

  <ul>
    <li><a class="link" href="https://github.com/yeo-develop" target="_blank" rel="noopener">
      <span class="icon">G</span><span class="label">GitHub<small>코드와 프로젝트</small></span><span class="arrow">→</span></a></li>
    <li><a class="link" href="https://github.com/yeo-develop/mylink" target="_blank" rel="noopener">
      <span class="icon">M</span><span class="label">MyLink 저장소<small>이 페이지의 소스 코드</small></span><span class="arrow">→</span></a></li>
    <li><a class="link" href="https://www.kw.ac.kr" target="_blank" rel="noopener">
      <span class="icon">K</span><span class="label">광운대학교<small>학교 홈페이지</small></span><span class="arrow">→</span></a></li>
  </ul>

  <footer>© 2026 여동욱 · GitHub Pages</footer>
</main>
</body>
</html>
